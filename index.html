<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meal Selection</title>
<style>
:root{--orange:#ff6b00;--purple:#5b1fd1;--text:#252525;--muted:#6b6b6b;--border:#e8e8e8;--bg:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);font-family:Arial,Segoe UI,sans-serif;color:var(--text)}
button,select{font:inherit}
.header-title{text-align:center;font-size:24px;font-weight:700;margin:4px 0 16px}
.flight-info,.meal-card{background:#fff;border:1px solid var(--border);border-radius:14px}
.flight-info{padding:16px;margin-bottom:16px}
.flight-header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.flight-route{font-size:18px;font-weight:700}.flight-departure{font-size:13px;color:var(--muted);margin-top:5px}
.selector-row{display:flex;gap:12px;margin-top:14px}.selector{flex:1}.selector label{display:block;font-size:11px;font-weight:700;color:#777;text-transform:uppercase;margin-bottom:6px}
select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:9px;background:#fafafa;color:#222}
.menu-container{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.meal-card{overflow:hidden;padding:12px}.meal-main{display:grid;grid-template-columns:215px 1fr;gap:14px}
.meal-img-container{position:relative}.meal-img{display:block;width:100%;height:248px;object-fit:cover;border-radius:10px}
.food-type{position:absolute;top:8px;right:8px;width:21px;height:21px;border:2px solid currentColor;background:#fff;display:grid;place-items:center}
.food-type.veg{color:#168344}.food-type.nonveg{color:#d6402e}.food-type.veg:after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.food-type.nonveg:after{content:"";width:8px;height:8px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.beverage-badge{position:absolute;bottom:0;left:0;right:0;padding:5px;text-align:center;background:var(--purple);color:#fff;font-size:12px;font-weight:700;border-radius:0 0 10px 10px}
.meal-content{min-width:0;display:flex;flex-direction:column}.meal-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.meal-tag{padding:4px 8px;border-radius:4px;background:var(--orange);color:#fff;font-size:11px;font-weight:700}
.meal-name{font-size:17px;font-weight:700;margin:0 0 7px}.meal-description{font-size:13px;line-height:1.45;color:#555;margin-bottom:12px}
.meal-meta{font-size:13px;color:#555;margin-bottom:7px}.meal-meta strong{color:#333}.allergens{font-size:12px;color:#666;line-height:1.4}
.meal-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px}.meal-price{font-size:17px;font-weight:700;color:var(--orange)}
.add-btn,.qty-btn,.confirm-btn,.controls button{border:0;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}
.add-btn{padding:10px 18px;border-radius:9px}.add-btn:disabled{background:#ccc;cursor:not-allowed}
.qty-box{display:flex;align-items:center;gap:8px}.qty-btn{width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1}.qty-btn:disabled{background:#ccc;cursor:not-allowed}.qty-count{min-width:20px;text-align:center;font-weight:700}
.nutrition-toggle{margin-top:12px;width:100%;padding:9px 2px;border:0;border-top:1px solid var(--border);background:#fff;color:#5b1fd1;text-align:left;font-weight:700;cursor:pointer}
.nutrition-panel{border:1px solid #ffd9c4;border-radius:12px;padding:12px;margin-top:6px;background:#fff}
.nutrition-title{font-size:18px;font-weight:700;margin-bottom:10px}.nutrition-head,.nutrition-row{display:grid;grid-template-columns:1.5fr 1fr .7fr;gap:10px;align-items:center}
.nutrition-head{padding:8px 0;border-top:2px solid var(--orange);border-bottom:1px solid #ffd9c4;font-size:12px;font-weight:700;color:#555}
.nutrition-row{padding:8px 0;border-bottom:1px solid #f0d9cd;font-size:13px}.nutrition-row:last-child{border-bottom:0}.nutrition-value{font-weight:700}.nutrition-rda{text-align:left}
.nutrition-note{font-size:11px;color:#777;margin-top:9px;line-height:1.4}
.controls{display:flex;justify-content:center;gap:8px;margin:16px 0}.controls button{padding:9px 18px;border-radius:8px}.controls button:disabled{background:#ccc;cursor:not-allowed}
.total-section{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 16px;box-shadow:0 -3px 14px rgba(0,0,0,.12);z-index:20}
.total-details{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.total-items{font-size:13px;color:#666}.total-amount{font-size:20px;font-weight:700}
.confirm-btn{width:100%;padding:13px;border-radius:10px;font-size:15px}.confirm-btn:disabled{background:#ccc;cursor:not-allowed}.body-padding{height:105px}
.empty{grid-column:1/-1;padding:28px;text-align:center;background:#fff;border-radius:12px;color:#666}
.success-screen{display:none;position:fixed;inset:0;background:#fff;z-index:50;align-items:center;justify-content:center;flex-direction:column}.success-icon{font-size:56px}
@media(max-width:900px){.menu-container{grid-template-columns:1fr}}
@media(max-width:620px){body{padding:10px}.selector-row{flex-direction:column}.meal-main{grid-template-columns:120px 1fr}.meal-img{height:150px}.meal-name{font-size:15px}.meal-description{font-size:12px}.meal-footer{align-items:flex-end}.nutrition-head,.nutrition-row{grid-template-columns:1.3fr 1fr .6fr;font-size:12px}}
</style>
</head>
<body>
<div id="mainContent">
  <div class="header-title">MEAL SELECTION</div>

  <section class="flight-info">
    <div class="flight-header">
      <div>
        <div class="flight-route" id="flightRoute">✈️ Loading flight...</div>
        <div class="flight-departure" id="flightDeparture"></div>
      </div>
    </div>
    <div class="selector-row">
      <div id="flightSelectorWrap" class="selector"></div>
      <div id="travellerSelectionWrap" class="selector"></div>
    </div>
  </section>

  <div id="menu" class="menu-container"></div>

  <div class="controls">
    <button id="prevBtn" onclick="prevPage()">← Prev</button>
    <span id="pageInfo" style="padding:9px 6px;color:#666;font-size:13px"></span>
    <button id="nextBtn" onclick="nextPage()">Next →</button>
  </div>
  <div class="body-padding"></div>
</div>

<div class="total-section">
  <div class="total-details">
    <div class="total-items"><span id="totalItems">0</span> items (<span id="totalMeals">0</span> meals)</div>
    <div class="total-amount">₹<span id="totalAmount">0</span></div>
  </div>
  <button id="confirmBtn" class="confirm-btn" onclick="confirmOrder()">Confirm Order</button>
</div>

<div id="successScreen" class="success-screen">
  <div class="success-icon">✅</div>
  <h2>Order Confirmed!</h2>
</div>

<script>
  const SSR_AVAILABILITY_URL = "https://staging-agents-relay-uat.qp.akasaair.com/bgws/api/ibe/agents/ssrAvailabilityV2";
  const STORYBLOK_API_URL = "https://api.storyblok.com/v2/cdn/stories/add-on/cafe-akasa?cv=1776840359&token=sH9JxEKw9A4QBfyCtQLD8Qtt&version=published";
  const DEFAULT_API_SOURCE = "CHATBOTWEB";

  const urlParams = new URLSearchParams(window.location.search);
  const authToken = urlParams.get("auth_token") || urlParams.get("authorization") || "";
  const qpBotApiKey = urlParams.get("qp_bot_api_key") || urlParams.get("qp-api-key") || "";
  const qpBotSource = urlParams.get("qp_bot_source") || urlParams.get("qp-bot-source") || DEFAULT_API_SOURCE;
  const passengerKeys = (urlParams.get("passengerKeys") || urlParams.get("passenger_keys") || urlParams.get("passenger_key") || "").split(",").map(s => s.trim()).filter(Boolean);
  let segmentKeys = (urlParams.get("segment_keys") || urlParams.get("segment_key") || "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);
  const travellerNamesFromUrl = (urlParams.get("travellerNames") || urlParams.get("travelerNames") || "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);

  let meals = [];
  // quantities is keyed by flight and traveller: { flightKey: { travellerIndex: { mealIndex: qty } } }
  let quantities = {};
  let currentPage = 0;
  let flightOptions = [];
  let selectedFlightIndex = 0;
  let selectedFlightSegmentKey = urlParams.get("segment_key") || (segmentKeys[0] || "");
  let currentTraveller = 0;
  const pageSize = 10;
  const MAX_QTY = 5;
  const FALLBACK_IMG = "https://via.placeholder.com/100";

  // Mock pricing - in real app, this would come from API
  const MEAL_PRICES = {
    "Easter Special ( Non-Veg)": 850,
    "default": 650
  };

  // -------------------------
  // Booking context, prefilled from the URL the bot builds
  // -------------------------
  function parseTravellerNames(raw, count) {
    let names = [];
    if (raw) {
      names = raw.split(",").map(n => n.trim()).filter(Boolean);
    }
    // Pad or fall back to generic labels if names are missing/insufficient
    for (let i = names.length; i < count; i++) {
      names.push(`Traveller ${i + 1}`);
    }
    return names;
  }

  const explicitTravellerCount = parseInt(urlParams.get("travellers"), 10);
  const inferredTravellerCount = Math.max(
    Number.isFinite(explicitTravellerCount) && explicitTravellerCount > 0 ? explicitTravellerCount : 0,
    travellerNamesFromUrl.length,
    passengerKeys.length,
    1
  );

  const bookingContext = {
    pnr: urlParams.get("pnr") || "",
    lastname: urlParams.get("lastname") || "",
    email: urlParams.get("email") || "",
    origin: urlParams.get("origin") || "",
    destination: urlParams.get("destination") || "",
    departure: urlParams.get("departure") || "",
    travellers: inferredTravellerCount
  };
  bookingContext.travellerNames = travellerNamesFromUrl.length
    ? travellerNamesFromUrl
    : parseTravellerNames(
        urlParams.get("travellerNames") || urlParams.get("travelerNames"),
        bookingContext.travellers
      );

  try {
    const parsedFlightOptions = JSON.parse(urlParams.get("flightOptions") || "[]");
    if (Array.isArray(parsedFlightOptions) && parsedFlightOptions.length) {
      flightOptions = parsedFlightOptions;
    }
  } catch (err) {
    console.warn("Unable to parse flight options from URL", err);
  }

  if (!flightOptions.length && (bookingContext.origin || bookingContext.destination || bookingContext.departure)) {
    flightOptions = [{
      origin: bookingContext.origin,
      destination: bookingContext.destination,
      departure: bookingContext.departure,
      segment_key: selectedFlightSegmentKey,
      segment_keys: segmentKeys.join(",")
    }];
  }

  if (flightOptions.length) {
    if (!selectedFlightSegmentKey) {
      selectedFlightSegmentKey = flightOptions[0].segment_key || (flightOptions[0].segment_keys || "").split(",").map(s => s.trim()).filter(Boolean)[0] || "";
    }

    const matchedIndex = flightOptions.findIndex(option => option.segment_key && option.segment_key === selectedFlightSegmentKey);
    if (matchedIndex >= 0) {
      selectedFlightIndex = matchedIndex;
    }

    const selectedFlight = flightOptions[selectedFlightIndex] || flightOptions[0] || {};
    bookingContext.origin = bookingContext.origin || selectedFlight.origin || "";
    bookingContext.destination = bookingContext.destination || selectedFlight.destination || "";
    bookingContext.departure = bookingContext.departure || selectedFlight.departure || "";

    const firstSegmentKey = selectedFlight.segment_key || (selectedFlight.segment_keys || "").split(",").map(s => s.trim()).filter(Boolean)[0] || "";
    if (!selectedFlightSegmentKey && firstSegmentKey) {
      selectedFlightSegmentKey = firstSegmentKey;
    }
  }

  function renderBookingContext() {
    const routeEl = document.getElementById("flightRoute");
    const departureEl = document.getElementById("flightDeparture");

    if (bookingContext.origin && bookingContext.destination) {
      routeEl.textContent = `✈️ ${bookingContext.origin} → ${bookingContext.destination}`;
    } else {
      routeEl.textContent = "✈️ Flight details unavailable";
    }

    departureEl.textContent = bookingContext.departure
      ? `Departs: ${bookingContext.departure}`
      : "";

    renderFlightSelector();
    renderTravellerSelection();
  }

  function switchTraveller(idx) {
    currentTraveller = parseInt(idx, 10) || 0;
    render();
  }

  function renderFlightSelector() {
    const wrap = document.getElementById("flightSelectorWrap");
    if (!wrap) return;

    if (flightOptions.length <= 1) {
      wrap.innerHTML = "";
      return;
    }

    const label = document.createElement("div");
    label.className = "flight-selector-label";
    label.textContent = "Select flight";

    const select = document.createElement("select");
    select.className = "flight-select";
    select.onchange = () => {
      selectedFlightIndex = parseInt(select.value, 10) || 0;
      const selectedFlight = flightOptions[selectedFlightIndex] || flightOptions[0] || {};
      bookingContext.origin = selectedFlight.origin || bookingContext.origin;
      bookingContext.destination = selectedFlight.destination || bookingContext.destination;
      bookingContext.departure = selectedFlight.departure || bookingContext.departure;
      const firstSegmentKey = (selectedFlight.segment_keys || selectedFlight.segment_key || "")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean)[0] || "";
      selectedFlightSegmentKey = selectedFlight.segment_key || firstSegmentKey || "";
      segmentKeys = (selectedFlight.segment_keys || selectedFlight.segment_key || "")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);
      renderBookingContext();
      render();
    };

    flightOptions.forEach((option, idx) => {
      const optionEl = document.createElement("option");
      optionEl.value = idx;
      optionEl.textContent = `${option.origin || ""} → ${option.destination || ""} • ${option.departure || ""}`.trim();
      if (idx === selectedFlightIndex) optionEl.selected = true;
      select.appendChild(optionEl);
    });

    wrap.innerHTML = "";
    wrap.appendChild(label);
    wrap.appendChild(select);
  }

  function getFlightStorageKey(index = selectedFlightIndex) {
    const flight = flightOptions[index] || flightOptions[0] || {};
    const explicitKey = flight.segment_key || flight.flight_key || flight.id || "";
    if (explicitKey) return explicitKey;

    const fallbackParts = [flight.origin, flight.destination, flight.departure, index + 1]
      .filter(Boolean)
      .map(part => String(part).trim())
      .join("-");

    return fallbackParts || `flight-${index}`;
  }

  function getCurrentFlightKey() {
    return getFlightStorageKey(selectedFlightIndex);
  }

  function getJourneyKeyForFlightKey(flightKey) {
    const option = flightOptions.find((option, idx) => getFlightStorageKey(idx) === flightKey);
    return option?.journeyKey || "";
  }

  function getMealsForFlightKey(flightKey) {
    const journeyKey = getJourneyKeyForFlightKey(flightKey);
    if (!journeyKey) {
      return meals;
    }
    return meals.filter(meal => meal.journeyKey === journeyKey);
  }

  function getAllSegmentKeys() {
    return flightOptions
      .flatMap(option => (option.segment_keys || option.segment_key || "").split(","))
      .map(s => s.trim())
      .filter(Boolean);
  }

  function getCurrentTravellerQuantities() {
    const flightKey = getCurrentFlightKey();
    if (!quantities[flightKey]) quantities[flightKey] = {};
    if (!quantities[flightKey][currentTraveller]) quantities[flightKey][currentTraveller] = {};
    return quantities[flightKey][currentTraveller];
  }

  function renderTravellerSelection() {
    const wrap = document.getElementById("travellerSelectionWrap");
    if (!wrap) return;

    wrap.innerHTML = "";
    const label = document.createElement("div");
    label.className = "traveller-selection-label";
    label.textContent = "Select traveller";

    const select = document.createElement("select");
    select.className = "traveller-select";
    select.onchange = () => {
      switchTraveller(select.value);
    };

    bookingContext.travellerNames.forEach((name, idx) => {
      const option = document.createElement("option");
      option.value = idx;
      const count = getTravellerItemCount(idx);
      option.textContent = count > 0 ? `${name} (${count})` : name;
      if (idx === currentTraveller) option.selected = true;
      select.appendChild(option);
    });

    wrap.appendChild(label);
    wrap.appendChild(select);
  }


  // -------------------------
  // Meal data helpers
  // -------------------------
  function extractText(field) {
    if (!field) return "";
    if (typeof field === "string") return field;
    if (Array.isArray(field)) return field.map(extractText).join(", ");
    if (field.text) return field.text;
    if (field.content) return field.content.map(extractText).join(" ");
    return "";
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  function getImage(meal) {
    let url = meal.mealThumbnailImage?.filename || meal.mealThumbnailImage || "";
    if (!url) return FALLBACK_IMG;
    if (url.startsWith("//")) url = "https:" + url;
    return url;
  }

  function flattenSsrItems(obj) {
    if (!obj || typeof obj !== "object") return [];
    if (Array.isArray(obj)) return obj.flatMap(flattenSsrItems);
    if (obj.ssrCode) return [obj];
    return Object.values(obj).flatMap(flattenSsrItems);
  }

  function isMealItem(item) {
    if (!item || typeof item !== "object") return false;
    const name = String(item.ssrName || item.name || "").toLowerCase();
    const code = String(item.ssrCode || "").toLowerCase();
    const description = String(item.description || "").toLowerCase();
    if (/bag|baggage|luggage|seat|insurance|extra|assurance/.test(name) ||
        /bag|baggage|luggage/.test(code) ||
        /bag|baggage|luggage/.test(description)) return false;
    return Boolean(
      item.mealPreference || item.imageUrl || item.mealThumbnailImage ||
      item.nutritionFacts || item.beverageIncluded !== undefined ||
      /meal|burger|biryani|pizza|chocolates|sandwich|wrap|box|platter|croissant/.test(name)
    );
  }

  function parseSsrAvailabilityMeals(data) {
    const journeys = data?.data?.ssrAvailability?.journeySsrs || [];
    const parsed = [];

    journeys.forEach(journey => {
      const journeyKey = journey?.journeyKey || "";
      flattenSsrItems(journey).filter(isMealItem).forEach(item => {
        if (!item.ssrCode) return;

        let availability = item.passengerAvailability;
        if (Array.isArray(availability)) {
          availability = availability.find(p => !passengerKeys.length || passengerKeys.includes(p.passengerKey)) || availability[0];
        } else {
          availability = availability || {};
        }

        const rawPrice = availability?.price ?? availability?.amount ?? item.price ?? 0;
        const price = typeof rawPrice === "number" ? rawPrice : parseFloat(rawPrice) || 0;

        parsed.push({
          ssrCode:item.ssrCode,
          ssrKey:availability?.ssrKey || item.ssrKey || "",
          journeyKey,
          mealName:item.ssrName || item.name || item.ssrCode,
          mealDescription:item.description || item.ssrName || item.name || "",
          mealThumbnailImage:item.imageUrl || item.mealThumbnailImage || item.thumbnailImage || "",
          nutritionFacts:item.nutritionFacts || [],
          beverageIncluded:Boolean(item.beverageIncluded),
          price,
          mealType:item.mealType || "",
          allergens:item.allergens || "",
          prebookLiner:item.prebookLiner || "",
          calorieAndGramLiner:item.calorieAndGramLiner || "",
          mealTagInfo:item.mealTagInfo || []
        });
      });
    });
    return parsed;
  }

  // Storyblok contains the presentation/nutrition metadata used by the meal cards.
  function apiHeaders() {
    const headers = {
      "Content-Type": "application/json",
      "QP-BOT-SOURCE": qpBotSource
    };
    if (authToken) headers["Authorization"] = authToken;
    if (qpBotApiKey) headers["QP-BOT-API-KEY"] = qpBotApiKey;
    return headers;
  }

  async function fetchStoryblokMeals() {
    try {
      const res = await fetch(STORYBLOK_API_URL);
      if (!res.ok) return {};
      const data = await res.json();
      const body = data?.story?.content?.body || [];
      return Object.fromEntries(
        body.filter(x => x?.mealSsrCode).map(x => [x.mealSsrCode, x])
      );
    } catch (err) {
      console.warn("Storyblok meal metadata fetch failed.", err);
      return {};
    }
  }

  function mergeMealMetadata(ssrMeals, metadata) {
    return ssrMeals.map(meal => {
      const meta = metadata[meal.ssrCode] || {};
      return {
        ...meal,
        ...meta,
        ssrCode:meal.ssrCode,
        ssrKey:meal.ssrKey,
        journeyKey:meal.journeyKey,
        price:meal.price,
        mealName:meta.mealName || meal.mealName,
        mealDescription:meta.mealDescription || meal.mealDescription,
        mealThumbnailImage:meta.mealThumbnailImage || meal.mealThumbnailImage,
        nutritionFacts:meta.nutritionFacts?.length ? meta.nutritionFacts : meal.nutritionFacts,
        beverageIncluded:meta.beverageIncluded ?? meal.beverageIncluded
      };
    });
  }

  function getPrice(meal) {
    if (typeof meal.price === "number" && meal.price > 0) return meal.price;
    return MEAL_PRICES[meal.mealName] || MEAL_PRICES.default;
  }

  function getNutrition(meal) {
    return meal.nutritionFacts?.[0] || {};
  }

  const NUTRITION_ROWS = [
    ["Energy","energy","energyRdaPercentage"],
    ["Protein","protein","proteinRdaPercentage"],
    ["Carbohydrates","carbohydrates","carbohydratesRdaPercentage"],
    ["Total Fat","totalFat","totalFatRdaPercentage"],
    ["Saturated Fat","saturatedFat","saturatedFatRdaPercentage"],
    ["Unsaturated Fat","unsaturatedFat","unSaturatedFatRdaPercentage"],
    ["Trans Fat","transFat","transFatRdaPercentage"],
    ["Total Sugar","totalSugar","sugarRdaPercentage"],
    ["Sodium","sodium","sodiumRdaPercentage"]
  ];

  function renderNutrition(meal, mealKey, open) {
    const n = getNutrition(meal);
    const rows = NUTRITION_ROWS.filter(([,valueKey]) => n[valueKey] !== undefined && n[valueKey] !== "");
    if (!rows.length) return "";

    const table = rows.map(([label,valueKey,rdaKey]) => `
      <div class="nutrition-row">
        <div>${label}</div>
        <div class="nutrition-value">${escapeHtml(n[valueKey])}</div>
        <div class="nutrition-rda">${escapeHtml(n[rdaKey] ?? "-")}${n[rdaKey] && !String(n[rdaKey]).includes("%") ? "%" : ""}</div>
      </div>`).join("");

    const note = n.avgCaloriesRequiredLiner || "";
    return `
      <button class="nutrition-toggle" type="button" onclick="toggleNutrition('${escapeHtml(mealKey)}')">
        Nutritional Facts ${open ? "⌃" : "⌄"}
      </button>
      ${open ? `
        <div class="nutrition-panel">
          <div class="nutrition-title">Nutritional Facts</div>
          <div class="nutrition-head"><div>Nutrition</div><div>Per 100 g</div><div>% RDA</div></div>
          ${table}
          ${note ? `<div class="nutrition-note">${escapeHtml(note)}</div>` : ""}
        </div>` : ""}`;
  }

  let openNutritionKey = null;

  function toggleNutrition(mealKey) {
    openNutritionKey = openNutritionKey === mealKey ? null : mealKey;
    render();
  }

  function render() {
    const container = document.getElementById("menu");
    container.innerHTML = "";

    if (!meals.length) {
      container.innerHTML = `<div class="empty"><strong>No meal options are available.</strong><br>Please verify your booking and try again.</div>`;
      renderTravellerSelection();
      updateTotal();
      updatePagination();
      return;
    }

    const flightKey = getCurrentFlightKey();
    const currentMeals = getMealsForFlightKey(flightKey);

    if (!currentMeals.length) {
      container.innerHTML = `<div class="empty"><strong>No meal options are available for this flight.</strong><br>Please select another flight or verify your booking.</div>`;
      renderTravellerSelection();
      updateTotal();
      updatePagination();
      return;
    }

    const maxPage = Math.max(0, Math.ceil(currentMeals.length / pageSize) - 1);
    currentPage = Math.min(currentPage, maxPage);
    const start = currentPage * pageSize;
    const pageItems = currentMeals.slice(start, start + pageSize);
    const travellerQty = getCurrentTravellerQuantities();

    pageItems.forEach((meal, i) => {
      const mealKey = meal.ssrKey || meal.ssrCode || meal.mealName || `${start + i}`;
      const qty = travellerQty[mealKey] || 0;
      const price = getPrice(meal);
      const tags = (meal.mealTagInfo || []).filter(t => t?.mealTag);
      const type = String(meal.mealType || "").toLowerCase();
      const open = openNutritionKey === mealKey;

      const card = document.createElement("article");
      card.className = "meal-card";

      const tagsHtml = [
        meal.prebookLiner,
        ...tags.map(t => t.mealTag)
      ].filter(Boolean).map(tag => `<span class="meal-tag">${escapeHtml(tag)}</span>`).join("");

      const nutrition = getNutrition(meal);
      const energy = nutrition.energy || meal.calorieAndGramLiner || "";

      card.innerHTML = `
        <div class="meal-main">
          <div class="meal-img-container">
            <img class="meal-img" src="${escapeHtml(getImage(meal))}" alt="${escapeHtml(meal.mealName)}"
                 onerror="this.src='${FALLBACK_IMG}'">
            ${type ? `<span class="food-type ${type === "veg" ? "veg" : "nonveg"}" title="${escapeHtml(type)}"></span>` : ""}
            ${meal.beverageIncluded ? `<span class="beverage-badge">☕ Beverage Included</span>` : ""}
          </div>
          <div class="meal-content">
            ${tagsHtml ? `<div class="meal-tags">${tagsHtml}</div>` : ""}
            <h3 class="meal-name">${escapeHtml(meal.mealName)}</h3>
            <div class="meal-description">${escapeHtml(extractText(meal.mealDescription))}</div>
            ${energy ? `<div class="meal-meta"><strong>${escapeHtml(energy)}</strong></div>` : ""}
            ${meal.allergens ? `<div class="allergens">${escapeHtml(meal.allergens)}</div>` : ""}
            <div class="meal-footer">
              <div class="meal-price">₹${price}</div>
              ${qty === 0
                ? `<button class="add-btn" type="button" onclick="increase('${escapeHtml(mealKey)}')">Add • ₹${price}</button>`
                : `<div class="qty-box">
                     <button class="qty-btn" type="button" onclick="decrease('${escapeHtml(mealKey)}')">−</button>
                     <span class="qty-count">${qty}</span>
                     <button class="qty-btn" type="button" onclick="increase('${escapeHtml(mealKey)}')" ${qty >= MAX_QTY ? "disabled" : ""}>+</button>
                   </div>`}
            </div>
          </div>
        </div>
        ${renderNutrition(meal, mealKey, open)}
      `;
      container.appendChild(card);
    });

    renderTravellerSelection();
    updateTotal();
    updatePagination();
  }

  function updatePagination() {
    const currentMeals = getMealsForFlightKey(getCurrentFlightKey());
    const pages = Math.max(1, Math.ceil(currentMeals.length / pageSize));
    document.getElementById("pageInfo").textContent = `Page ${currentPage + 1} of ${pages}`;
    document.getElementById("prevBtn").disabled = currentPage === 0;
    document.getElementById("nextBtn").disabled = currentPage >= pages - 1;
  }

  function increase(mealKey) {
    const travellerQty = getCurrentTravellerQuantities();
    travellerQty[mealKey] = Math.min((travellerQty[mealKey] || 0) + 1, MAX_QTY);
    render();
  }

  function decrease(mealKey) {
    const travellerQty = getCurrentTravellerQuantities();
    travellerQty[mealKey] = Math.max((travellerQty[mealKey] || 0) - 1, 0);
    render();
  }

  function getTravellerItemCount(travellerIdx, flightKey = getCurrentFlightKey()) {
    const travellerQty = quantities[flightKey]?.[travellerIdx] || {};
    return Object.values(travellerQty).reduce((a,b) => a + b, 0);
  }

  function getTotalItems() {
    const flightKey = getCurrentFlightKey();
    return Object.keys(quantities[flightKey] || {}).reduce(
      (total,t) => total + getTravellerItemCount(parseInt(t,10), flightKey), 0
    );
  }

  function getTotalMeals() {
    const flightKey = getCurrentFlightKey();
    return Object.values(quantities[flightKey] || {}).reduce(
      (count,q) => count + Object.values(q || {}).filter(v => v > 0).length, 0
    );
  }

  function getTotalAmount() {
    const flightKey = getCurrentFlightKey();
    const flightMeals = getMealsForFlightKey(flightKey);
    return Object.values(quantities[flightKey] || {}).reduce((total,q) => {
      return total + Object.entries(q || {}).reduce((sum,[mealKey,qty]) => {
        const meal = flightMeals.find(m => (m.ssrKey || m.ssrCode || m.mealName) === mealKey);
        return sum + (meal && qty > 0 ? getPrice(meal) * qty : 0);
      },0);
    },0);
  }

  function updateTotal() {
    const items = getTotalItems(), mealsCount = getTotalMeals(), amount = getTotalAmount();
    document.getElementById("totalItems").textContent = items;
    document.getElementById("totalMeals").textContent = mealsCount;
    document.getElementById("totalAmount").textContent = amount;
    const btn = document.getElementById("confirmBtn");
    btn.disabled = items === 0;
    btn.textContent = items ? `Confirm Order (${items} items) • ₹${amount}` : "Confirm Order";
  }

  function nextPage() {
    const count = getMealsForFlightKey(getCurrentFlightKey()).length;
    if ((currentPage + 1) * pageSize < count) {
      currentPage++;
      openNutritionKey = null;
      render();
      window.scrollTo({top:document.getElementById("menu").offsetTop - 10,behavior:"smooth"});
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      openNutritionKey = null;
      render();
      window.scrollTo({top:document.getElementById("menu").offsetTop - 10,behavior:"smooth"});
    }
  }

  // -------------------------
  // Fetch SSR + Storyblok metadata
  // -------------------------
  async function fetchMeals() {
    if (!passengerKeys.length || !authToken || !qpBotApiKey) {
      meals = [];
      render();
      return;
    }

    try {
      // Do not let Storyblok failure prevent the SSR meal list from rendering.
      // Some WebView/proxy environments can return ERR_CONTENT_DECODING_FAILED for
      // the Storyblok CDN response. Nutrition metadata is optional in that case.
      const [ssrResult, storyResult] = await Promise.allSettled([
        fetch(SSR_AVAILABILITY_URL,{
          method:"POST",
          headers:apiHeaders(),
          body:JSON.stringify(passengerKeys)
        }),
        fetchStoryblokMeals()
      ]);

      if (ssrResult.status !== "fulfilled") {
        throw ssrResult.reason || new Error("SSR availability request failed");
      }

      const ssrRes = ssrResult.value;
      if (!ssrRes.ok) throw new Error(`SSR availability returned ${ssrRes.status}`);

      const data = await ssrRes.json();
      const metadata = storyResult.status === "fulfilled" ? storyResult.value : {};
      if (storyResult.status === "rejected") {
        console.warn("Storyblok metadata unavailable; rendering SSR data only.", storyResult.reason);
      }
      meals = mergeMealMetadata(parseSsrAvailabilityMeals(data), metadata);

      if (!meals.length) console.warn("SSR availability returned no meals.");
    } catch (err) {
      console.warn("Meal fetch failed.", err);
      meals = [];
    }
    render();
  }

  // -------------------------
  // Webview -> Bot handoff
  // -------------------------
  function sendOrderToBot(orderData) {
    const mealsEncoded = orderData.meals.map(m => m.ssrCode
      ? `${m.travellerIndex + 1}|${m.ssrCode}|${m.ssrKey || ""}|${m.price}|${m.qty}`
      : `${m.traveller}:${m.name}:${m.qty}:${m.price}`
    ).join(",");

    let data =
      "pnr=" + orderData.pnr +
      "||lastname=" + orderData.lastname +
      "||email=" + orderData.email +
      "||origin=" + orderData.origin +
      "||destination=" + orderData.destination +
      "||departure=" + orderData.departure +
      "||travellers=" + orderData.travellers +
      "||flight_segment_key=" + orderData.flight_segment_key +
      "||segment_keys=" + (orderData.segment_keys || orderData.flight_segment_key || "") +
      "||selected_travellers=" + orderData.selected_travellers +
      "||travellerNames=" + (orderData.travellerNames || bookingContext.travellerNames.join(",")) +
      "||selected_meals=" + mealsEncoded +
      "||capture_meal_selection=" + mealsEncoded +
      "||selected_meal=" + (orderData.selected_meal || mealsEncoded) + " ";

    data = encodeURIComponent(data.split(",").join(";;").split("&").join("^%"));
    const message = `{api_name:akasa_meal,data:${data}}`;

    if (window.parent) {
      window.parent.postMessage(
        `http://haptik-webview//perform-action?action=close&message=${message}&message_type=0`,"*"
      );
    }
  }

  function getSelectedMealsAcrossFlights() {
    const selectedMeals = [];
    Object.keys(quantities).forEach(flightKey => {
      const flightMeals = getMealsForFlightKey(flightKey);
      Object.keys(quantities[flightKey] || {}).forEach(t => {
        const travellerIndex = parseInt(t,10);
        const travellerQty = quantities[flightKey][t] || {};
        const traveller = bookingContext.travellerNames[travellerIndex] || `Traveller ${travellerIndex + 1}`;

        Object.keys(travellerQty).forEach(mealKey => {
          const qty = travellerQty[mealKey];
          const meal = flightMeals.find(m => (m.ssrKey || m.ssrCode || m.mealName) === mealKey);
          if (qty > 0 && meal) {
            selectedMeals.push({
              traveller,travellerIndex,name:meal.mealName,qty,
              price:getPrice(meal),ssrCode:meal.ssrCode || "",ssrKey:meal.ssrKey || ""
            });
          }
        });
      });
    });
    return selectedMeals;
  }

  function getSelectedTravellerValues() {
    const values = new Set();
    Object.keys(quantities).forEach(flightKey => {
      Object.keys(quantities[flightKey] || {}).forEach(t => {
        if (getTravellerItemCount(parseInt(t,10),flightKey) > 0) values.add(parseInt(t,10) + 1);
      });
    });
    if (!values.size) values.add(currentTraveller + 1);
    return Array.from(values).sort((a,b) => a-b);
  }

  async function confirmOrder() {
    const selectedMeals = getSelectedMealsAcrossFlights();
    if (!selectedMeals.length) return alert("Select at least one item");

    const orderData = {
      pnr:bookingContext.pnr,lastname:bookingContext.lastname,email:bookingContext.email,
      origin:bookingContext.origin,destination:bookingContext.destination,departure:bookingContext.departure,
      travellers:bookingContext.travellers,
      flight_segment_key:selectedFlightSegmentKey || segmentKeys[0] || "",
      segment_keys:getAllSegmentKeys().join(","),
      selected_travellers:getSelectedTravellerValues().join(","),
      travellerNames:bookingContext.travellerNames.join(","),
      meals:selectedMeals,
      selected_meal:selectedMeals.map(m =>
        `${m.travellerIndex + 1}|${m.ssrCode}|${m.ssrKey || ""}|${m.price}|${m.qty}`
      ).join(","),
      totalItems:selectedMeals.reduce((s,m) => s + m.qty,0),
      totalAmount:selectedMeals.reduce((s,m) => s + m.qty * m.price,0)
    };

    document.getElementById("mainContent").style.display = "none";
    document.querySelector(".total-section").style.display = "none";
    document.getElementById("successScreen").style.display = "flex";
    setTimeout(() => sendOrderToBot(orderData),2000);
  }

  renderBookingContext();
  fetchMeals();

</script>
